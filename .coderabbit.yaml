# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Central CodeRabbit configuration for the ncz-os organisation.
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  path_filters:
    - "!**/*.png"
    - "!**/*.svg"
    - "!**/*.iride"
    - "!**/golden/**"
    - "!**/docs/research/**"
    - "!**/*.lock"
chat:
  auto_reply: true
